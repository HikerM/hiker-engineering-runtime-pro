name: private-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Codex CLI for adapter probe
        run: |
          npm install --global @openai/codex@0.151.0
          ./.github/scripts/Install-CodexNativeShim.ps1 `
            -PackageRoot (npm root --global) `
            -DestinationRoot (Join-Path $env:RUNNER_TEMP 'hiker-codex-bin') `
            -GitHubPathFile $env:GITHUB_PATH
      - name: Restore
        run: dotnet restore Hiker.Pro.slnx
      - name: Version facts
        run: dotnet run --project tools/Hiker.Pro.Release -c Release --no-restore -- version-check --root .
      - name: Format
        run: dotnet format Hiker.Pro.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build Hiker.Pro.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Hiker.Pro.slnx -c Release --no-build
      - name: Commercial deterministic gates
        run: dotnet run --project tools/Hiker.Pro.Verification -c Release --no-build -- --scenario commercial-security --root .
